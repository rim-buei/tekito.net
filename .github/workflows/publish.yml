name: Publish
permissions: {}

on:
  push:
    branches:
      - main

env:
  # renovate: datasource=github-releases depName=gohugoio/hugo
  HUGO_VERSION: 0.169.0

jobs:
  publish:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@d1c81a15d4e6dca7086a17b9c2565cb70fd576bf # v3.3.0
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Tweak hugo.toml
        run: |
          sed -E 's|^(author[[:space:]]*=[[:space:]]*).*|\1"${{ secrets.AUTHOR }}"|' -i hugo.toml

      - name: Build
        run: hugo --minify

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Upload contents to the S3 bucket
        run: |
          aws s3 sync --quiet --delete ./public s3://${{ secrets.AWS_S3_BUCKET }}
